name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  html:
    name: HTML validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: npx --yes html-validate@9 "**/*.html"

  links:
    name: Link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --exclude-loopback
            --root-dir "${{ github.workspace }}"
            --exclude-path _site
            "**/*.html" "**/*.md" ".well-known/security.txt"
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  go-import:
    name: Go vanity-import pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Every module directory carries go-import and go-source tags
        run: |
          status=0
          for page in $(find . -mindepth 2 -name index.html -not -path './_site/*' -not -path './.git/*'); do
            module="${page#./}"; module="mmft.dev/${module%/index.html}"
            for tag in go-import go-source; do
              if grep -q "<meta name=\"$tag\" content=\"$module " "$page"; then
                echo "ok   $page $tag"
              else
                echo "FAIL $page has no $tag meta tag for $module"
                status=1
              fi
            done
          done
          exit $status

  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: false
