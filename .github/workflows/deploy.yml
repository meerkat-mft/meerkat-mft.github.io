name: Deploy

on:
  push:
    branches: [main]
  schedule:
    # Nightly, so the project-status figures on the page stay current.
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push waits for the running one to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Assemble the site
        run: |
          rsync -a --delete ./ _site/ \
            --exclude .git --exclude .github --exclude _site \
            --exclude README.md --exclude LICENSE --exclude SECURITY.md \
            --exclude .gitignore --exclude .htmlvalidate.json --exclude lighthouserc.json \
            --exclude scripts
          find _site -type f | sort

      - name: Fill in the project-status figures
        run: python3 scripts/status.py _site/index.html _site/index.html
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          # v5 drops dotfiles by default; .well-known/ and .nojekyll must ship.
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
