<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="robots" content="noindex">
  <title>Page not found · Meerkat MFT</title>
  <meta name="theme-color" content="#14202E">
  <link rel="icon" href="/meerkat-logo.svg" type="image/svg+xml">
  <link rel="icon" href="/meerkat-icon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="/meerkat-icon-180.png">
  <style>
    @font-face { font-family: "Fraunces"; src: url("/fonts/fraunces-latin-wght-normal.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
    @font-face { font-family: "IBM Plex Mono"; src: url("/fonts/ibm-plex-mono-latin-400-normal.woff2") format("woff2"); font-weight: 400; font-display: swap; }
    @font-face { font-family: "IBM Plex Mono"; src: url("/fonts/ibm-plex-mono-latin-500-normal.woff2") format("woff2"); font-weight: 500; font-display: swap; }

    :root {
      --ink-deep: #0E1722;
      --ink: #14202E;
      --line: #33465A;
      --amber: #E2A04A;
      --cream: #F6E3C2;
      --muted: #A9B4C0;
      --gutter: clamp(16px, 5vw, 72px);
      --pad: max(var(--gutter), calc((100vw - 1400px) / 2));
      --serif: "Fraunces", Georgia, serif;
      --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
    }

    * { box-sizing: border-box; }
    html { background: var(--ink-deep); -webkit-text-size-adjust: 100%; }
    body { margin: 0; min-height: 100svh; display: flex; flex-direction: column; background: var(--ink); color: var(--cream); font: 400 15px/1.65 var(--mono); }
    a { color: inherit; }
    h1, p { margin: 0; }

    .bar { display: flex; justify-content: space-between; gap: 16px; padding: 28px var(--pad) 0; font-size: 12px; letter-spacing: .08em; color: var(--muted); }
    .brand { display: inline-flex; align-items: center; gap: 10px; color: var(--cream); font-weight: 500; text-decoration: none; }
    .brand svg { width: 26px; height: 26px; }

    main { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 48px var(--pad) 72px; }
    .label { font-size: 12px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: var(--amber); }
    h1 { margin-top: 14px; max-width: 13.5em; font: 400 clamp(40px, 5vw, 72px)/1 var(--serif); letter-spacing: -.025em; font-variation-settings: "SOFT" 0, "WONK" 1; }
    h1 em { display: block; font-style: italic; font-weight: 300; color: var(--amber); }
    .lede { margin-top: 20px; max-width: 52ch; color: var(--muted); }
    .tag { display: inline-block; margin-top: 32px; padding: 3px 9px; border: 1px solid var(--amber); font-size: 12px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: var(--amber); text-decoration: none; }

    footer { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px 32px; padding: 26px var(--pad) 34px; background: var(--ink-deep); border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }
  </style>
</head>
<body>
  <div class="bar">
    <a class="brand" href="/"><svg viewBox="0 0 512 512" aria-hidden="true"><circle cx="256" cy="256" r="248" fill="#1B2A3B"/><clipPath id="brandclip"><circle cx="256" cy="256" r="248"/></clipPath><g clip-path="url(#brandclip)"><g transform="translate(-36 -72) scale(1.12)"><path fill="#E2A04A" stroke="#E2A04A" stroke-width="10" stroke-linejoin="round" d="M400 229 L308 158 Q298 150 284 148 L246 146 Q226 146 214 160 L198 180 Q190 190 192 202 L204 272 L156 530 L322 530 L300 332 L292 274 Z"/><path fill="#F6E3C2" stroke="#F6E3C2" stroke-width="10" stroke-linejoin="round" d="M292 274 L300 332 L322 530 L254 530 L254 356 Q256 330 272 298 Z"/><path fill="#14202E" d="M204 184 Q206 166 232 166 Q236 190 216 208 Q206 204 204 184 Z"/><path fill="#14202E" d="M254 198 Q290 190 326 216 Q292 234 262 222 Q246 212 254 198 Z"/><path fill="#8A4F1D" stroke="#8A4F1D" stroke-width="10" stroke-linejoin="round" d="M372 207 L400 229 L368 243 Q362 224 372 207 Z"/></g></g></svg>Meerkat MFT</a>
    <span>Error 404</span>
  </div>

  <main>
    <p class="label">Page not found</p>
    <h1>Nothing was delivered here.<em>The address doesn't exist.</em></h1>
    <p class="lede">The page may have moved, or the link was wrong. The front page has everything that's published so far.</p>
    <a class="tag" href="/">Back to the front page</a>
  </main>

  <footer>
    <span>Open source under AGPL 3.0. Not ready for real use.</span>
    <span>mmft.dev</span>
  </footer>
</body>
</html>
