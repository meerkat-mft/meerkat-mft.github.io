<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meerkat MFT</title>
  <meta name="description" content="Meerkat MFT is an open source managed file transfer orchestrator in early development.">
  <link rel="icon" href="/meerkat-logo.svg" type="image/svg+xml">
  <style>
    :root { --bg: #fff; --fg: #14202E; --muted: #55606E; }
    @media (prefers-color-scheme: dark) { :root { --bg: #14202E; --fg: #F6E3C2; --muted: #B9C2CC; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box;
      background: var(--bg); color: var(--fg); font: 18px/1.5 system-ui, sans-serif; text-align: center; }
    main { max-width: 34rem; }
    img { width: 140px; height: 140px; }
    h1 { margin: 20px 0 8px; font-size: 2.25rem; line-height: 1.2; }
    p { margin: 0 0 12px; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <img src="/meerkat-logo.svg" alt="Meerkat MFT logo">
    <h1>Meerkat MFT</h1>
    <p>An open source managed file transfer orchestrator. Agents connect outbound, nothing listens on the public internet, and the orchestrator cannot read your files.</p>
    <p>In early development. Not ready for real use.</p>
  </main>
</body>
</html>
